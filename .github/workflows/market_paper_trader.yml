name: Market Intelligence & Multi-Bot Trading Tournament

on:
  push:
    branches: [ main ]
  schedule:
    # Runs every 4 hours, 7 days a week (including Saturday & Sunday for weekend news catalysts)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  trade-and-scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run News Scraper & Vector Indexing (7 Days a Week)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          EMBEDDING_MODEL_NAME: BAAI/bge-small-en-v1.5
        run: |
          python run_pipeline.py --scrape

      - name: Check Relevant NIFTY News & Sentiment Impact
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          EMBEDDING_MODEL_NAME: BAAI/bge-small-en-v1.5
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python run_pipeline.py --check-news --symbol NIFTY

      - name: Execute Multi-Bot Tournament & Publish Live Leaderboard
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          EMBEDDING_MODEL_NAME: BAAI/bge-small-en-v1.5
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python run_pipeline.py --trade

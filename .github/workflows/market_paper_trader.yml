name: Market Intelligence & $5,000 Paper Trading Bot

on:
  schedule:
    # Runs Monday to Friday every 4 hours (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: '0 */4 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  trade-and-scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run News Scraper & Vector Indexing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          EMBEDDING_MODEL_NAME: BAAI/bge-small-en-v1.5
        run: |
          python run_pipeline.py --scrape

      - name: Execute Paper Trading Strategy & Update Portfolio
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          EMBEDDING_MODEL_NAME: BAAI/bge-small-en-v1.5
        run: |
          python run_pipeline.py --trade
